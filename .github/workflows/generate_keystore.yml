name: Generate Keystore
on:
  workflow_dispatch: {}
jobs:
  generate:
    name: Generate signing keystore
    runs-on: ubuntu-latest
    steps:
      - name: Check that password secret is set
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Сначала создайте секрет KEYSTORE_PASSWORD (см. инструкцию)."
            exit 1
          fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -alias pi_auth \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=EurasianBank Authenticator, OU=Mobile, O=EurasianBank, L=Almaty, ST=Almaty, C=KZ"
      - name: Encode keystore to base64
        run: base64 -w 0 keystore.jks > keystore_base64.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            keystore.jks
            keystore_base64.txt
          retention-days: 30
